# One web service that builds the client and serves it from the game server,
# so the app and the socket share an origin.
#
# Rooms live in this process's memory. Keep it to a single instance: two
# instances would each hold their own rooms and players would be split.
services:
  - type: web
    name: kadi-teri
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
